<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations!</title>
    <style>
        /* Overall Page Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0c20; /* Dark premium background */
            background: linear-gradient(to right, #141026, #0f0c20, #06040a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        
        /* Container Card */
        .card {
            background: rgba(255, 255, 255, 0.03);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            width: 400px;
            transition: all 0.5s ease-in-out;
        }

        /* Message text with glow effect */
        h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            color: #00ffcc;
            animation: fadeIn 0.8s ease-in-out;
        }

        /* Screen 2 changes color for a fresh vibe */
        .screen-2 h1 {
            color: #ff3366;
            text-shadow: 0 0 10px rgba(ff, 33, 102, 0.6);
        }

        /* Next Button Styling */
        .btn {
            background: linear-gradient(45deg, #00ffcc, #0099ff);
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.7);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Smooth Hide/Show classes */
        .hidden {
            display: none !important;
        }

        /* Simple Fade In Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="screen1" class="card">
        <h1>Naya Pyar Mubarak Ho Aapko ❤️</h1>
        <button class="btn" onclick="showNextScreen()">Next</button>
    </div>

    <div id="screen2" class="card screen-2 hidden">
        <h1>Naya Yaar Mubarak Ho Aapko ✨</h1>
    </div>

    <script>
        // Function to switch between screens smoothly
        function showNextScreen() {
            const screen1 = document.getElementById('screen1');
            const screen2 = document.getElementById('screen2');
            
            // Hide first screen
            screen1.classList.add('hidden');
            
            // Show second screen
            screen2.classList.remove('hidden');
        }
    </script>

</body>
</html>
