<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Message</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){ emailjs.init({ publicKey: "5ijt6R7KPYcuCtNvK" }); })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #0f0c20; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .card { 
            background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 20px; 
            width: 90%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
            display: none; /* Sab hidden hain */
        }
        
        /* Sirf Lock Screen dikhegi start mein */
        #lockScreen { display: block; }

        input, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #1a1a2e; color: #fff; }
        button { padding: 12px 30px; border-radius: 25px; border: none; background: #00ffcc; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        #toast { 
            position: fixed; bottom: 20px; background: #333; color: #fff; padding: 15px; border-radius: 10px; 
            display: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div id="lockScreen" class="card">
        <h1>🔒 Locked</h1>
        <input type="password" id="passInput" placeholder="Enter Password">
        <button onclick="checkPass()">Unlock</button>
    </div>

    <div id="screen1" class="card">
        <h1>Naya Pyar Mubarak!</h1>
        <button onclick="changeScreen('screen2')">Next</button>
    </div>

    <div id="screen2" class="card">
        <h1>Naya Yaar Mubarak!</h1>
        <button onclick="changeScreen('screen3')">Next</button>
    </div>

    <div id="screen3" class="card">
        <p>Text yahan hai... (Broken Heart stuff)</p>
        <button onclick="changeScreen('screen4')">Next</button>
    </div>

    <div id="screen4" class="card">
        <textarea id="msgBox" placeholder="Kuch likhein..."></textarea>
        <button onclick="sendMsg()">Send</button>
    </div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function checkPass() {
            const p = document.getElementById('passInput').value;
            if (p === "1234") {
                changeScreen('screen1');
            } else {
                showToast("❌ Wrong Password!");
            }
        }

        function changeScreen(id) {
            // Saari screens hide karo
            document.querySelectorAll('.card').forEach(s => s.style.display = 'none');
            // Target screen dikhao
            document.getElementById(id).style.display = 'block';
        }

        function sendMsg() {
            const msg = document.getElementById('msgBox').value;
            if(!msg) return showToast("Kuch likho toh sahi!");
            
            emailjs.send('service_g9hb3t6', 'template_e9aw4ub', {message: msg})
                .then(() => showToast("✔️ Sent!"))
                .catch(() => showToast("❌ Failed!"));
        }
    </script>
</body>
</html>
