<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Message</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init({
              publicKey: "5ijt6R7KPYcuCtNvK",
            });
        })();
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0c20; 
            background: linear-gradient(to right, #141026, #0f0c20, #06040a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* ⏳ SITE MAIN PRELOADER */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #090714;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, pointer-events 0.6s ease;
        }

        /* 📸 FIXED MEMORIES LOADER SCREEN */
        #memoriesLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #090714;
            z-index: 99998;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .main-loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 204, 0.1);
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            margin-bottom: 20px;
        }

        .memory-loader-circle {
            border-top: 4px solid #ff3366;
            box-shadow: 0 0 15px rgba(255, 33, 102, 0.4);
        }

        .loading-text {
            font-size: 1.1rem;
            color: #aaa;
            letter-spacing: 2px;
            font-weight: 500;
            animation: pulse 1.5s infinite ease-in-out;
        }

        /* 🎵 MUSIC CONTROLLER BUTTON STYLE */
        #musicToggleBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9995;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            transition: all 0.3s ease;
            display: none; 
            align-items: center;
            gap: 5px;
        }
        #musicToggleBtn:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            transform: scale(1.05);
        }
        
        .card {
            background: rgba(255, 255, 255, 0.03);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 100%;
            width: 440px;
            transition: all 0.5s ease-in-out;
            animation: fadeIn 0.8s ease-in-out;
            position: relative;
            z-index: 10;
        }

        .gallery-card {
            width: 850px; 
            max-height: 85vh;
            overflow-y: auto; 
            padding: 30px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            color: #00ffcc;
        }

        .pass-input, .text-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 25px;
            border: 2px solid rgba(0, 255, 204, 0.3);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .text-input {
            border-radius: 15px;
            resize: none;
            text-align: left;
            font-size: 1rem;
            border-color: rgba(255, 153, 0, 0.3);
        }

        .pass-input:focus { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .text-input:focus { border-color: #ff9900; box-shadow: 0 0 10px rgba(255, 153, 0, 0.5); }

        .screen-2 h1 { color: #ff3366; text-shadow: 0 0 10px rgba(255, 33, 102, 0.6); }
        .screen-3 h1 { font-size: 1.25rem; color: #ff9900; text-shadow: 0 0 10px rgba(255, 153, 0, 0.5); line-height: 1.6; font-style: italic; }
        .screen-4 h1 { font-size: 1.15rem; color: #ff3333; text-shadow: 0 0 12px rgba(255, 51, 51, 0.6); line-height: 1.6; font-weight: 600; }
        .screen-5 h1 { color: #ff9900; text-shadow: 0 0 10px rgba(255, 153, 0, 0.5); font-size: 1.5rem; }
        .screen-6 h1 { color: #00ffcc; margin-bottom: 20px; }

        .btn {
            background: linear-gradient(45deg, #00ffcc, #0099ff);
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-memories {
            background: linear-gradient(45deg, #00ffcc, #ff3366);
            color: #fff;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
        }

        .screen-2 .btn { background: linear-gradient(45deg, #ff3366, #ff9900); box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4); }
        .screen-3 .btn { background: linear-gradient(45deg, #ff9900, #ff3333); box-shadow: 0 5px 15px rgba(255, 153, 0, 0.4); }
        .screen-4 .btn { background: linear-gradient(45deg, #ff3333, #ff9900); box-shadow: 0 5px 15px rgba(255, 51, 51, 0.4); }
        .screen-5 .btn-main { background: linear-gradient(45deg, #ff9900, #00ffcc); box-shadow: 0 5px 15px rgba(255, 153, 0, 0.4); }

        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(1px); }
        .hidden { display: none !important; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(0, 0, 0, 0.2);
            border-top: 3px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .heart-fall {
            position: absolute;
            top: -20px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .media-box {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .media-box:hover {
            transform: scale(1.05);
            border-color: #00ffcc;
        }
        .media-box img, .media-box video {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .gallery-card::-webkit-scrollbar { width: 6px; }
        .gallery-card::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .gallery-card::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 10px; }

        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .fullscreen-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .fullscreen-overlay img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            transform: scale(0.9);
            transition: transform 0.4s ease;
        }
        .fullscreen-overlay.active img {
            transform: scale(1);
        }
        .close-overlay {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 35px;
            color: #fff;
            cursor: pointer;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: color 0.3s;
        }
        .close-overlay:hover {
            color: #ff3366;
        }

        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="main-loader"></div>
        <div class="loading-text">LOADING SECRET MESSAGE...</div>
    </div>

    <div id="memoriesLoader">
        <div class="main-loader memory-loader-circle"></div>
        <div class="loading-text" style="color: #ff3366; text-shadow: 0 0 5px rgba(255,33,102,0.2);">LOADING MEMORIES... 💔</div>
    </div>

    <button id="musicToggleBtn" onclick="toggleMusic()">🎵 Mute</button
