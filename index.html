<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0c20; 
            background: linear-gradient(to right, #141026, #0f0c20, #06040a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 📸 MEMORIES LOADER SCREEN */
        #memoriesLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #090714;
            z-index: 99998;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .main-loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 204, 0.1);
            border-top: 4px solid #ff3366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(255, 33, 102, 0.4);
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 1.1rem;
            color: #aaa;
            letter-spacing: 2px;
            font-weight: 500;
            animation: pulse 1.5s infinite ease-in-out;
        }

        /* 🎵 MUSIC CONTROLLER BUTTON STYLE */
        #musicToggleBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9995;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            transition: all 0.3s ease;
            display: none; 
            align-items: center;
            gap: 5px;
        }
        #musicToggleBtn:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            transform: scale(1.05);
        }
        
        .card {
            background: rgba(255, 255, 255, 0.03);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 100%;
            width: 440px;
            transition: all 0.5s ease-in-out;
            animation: fadeIn 0.8s ease-in-out;
            position: relative;
            z-index: 10;
        }

        .gallery-card {
            width: 850px; 
            max-height: 85vh;
            overflow-y: auto; 
            padding: 30px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            color: #00ffcc;
        }

        .pass-input, .text-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 25px;
            border: 2px solid rgba(0, 255, 204, 0.3);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .text-input {
            border-radius: 15px;
            resize: none;
            text-align: left;
            font-size: 1rem;
            border-color: rgba(255, 153, 0, 0.3);
        }

        .pass-input:focus { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .text-input:focus { border-color: #ff9900; box-shadow: 0 0 10px rgba(255, 153, 0, 0.5); }

        .screen-2 h1 { color: #ff3366; text-shadow: 0 0 10px rgba(255, 33, 102, 0.6); }
        .
