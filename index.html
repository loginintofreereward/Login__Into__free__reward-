<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Message</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){ emailjs.init({ publicKey: "5ijt6R7KPYcuCtNvK" }); })();
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0c20; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; transition: background 0.8s ease-in-out; }

        /* Backgrounds */
        body.bg-lockScreen { background: radial-gradient(circle, #1b182b, #090714); }
        body.bg-screen1 { background: linear-gradient(135deg, #160a20, #08030f); }
        
        .card { background: rgba(255, 255, 255, 0.05); padding: 35px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); width: 400px; text-align: center; display: none; }
        #lockScreen { display: block; }

        /* UNIQUE POPUP (Custom Alert) */
        #customPopup {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            background: #ff3366; color: white; padding: 15px 30px; border-radius: 50px;
            font-weight: bold; display: none; z-index: 9999; box-shadow: 0 10px 20px rgba(255,51,102,0.4);
        }
        
        /* SUCCESS NOTIFICATION */
        #successToast {
            position: fixed; bottom: 30px; background: #00ffcc; color: #000; padding: 15px 25px;
            border-radius: 10px; display: none; z-index: 9999; font-weight: bold;
        }

        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(-50%); } 25% { transform: translateX(-55%); } 75% { transform: translateX(-45%); } }

        .btn { background: #00ffcc; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .pass-input { width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #555; background: #000; color: #fff; text-align: center; }
    </style>
</head>
<body class="bg-lockScreen">

    <div id="customPopup">❌ Password Galat Hai Yaar!</div>
    <div id="successToast">✅ Message Bhej Diya Gaya!</div>

    <div id="lockScreen" class="card">
        <h1>🔒 Locked</h1>
        <input type="password" id="passwordField" class="pass-input" placeholder="Password...">
        <button class="btn" onclick="checkPassword()">Unlock</button>
    </div>

    <!-- Screen 1 example -->
    <div id="screen1" class="card">
        <h1>Welcome! ✨</h1>
        <button class="btn" onclick="sendEmail()">Send Mock Message</button>
    </div>

    <script>
        // 1. UNIQUE POPUP FUNCTION
        function showPopup() {
            const popup = document.getElementById('customPopup');
            popup.style.display = 'block';
            document.getElementById('lockScreen').classList.add('shake');
            setTimeout(() => { 
                popup.style.display = 'none'; 
                document.getElementById('lockScreen').classList.remove('shake');
            }, 2000);
        }

        // 2. SUCCESS TOAST FUNCTION
        function showSuccess() {
            const toast = document.getElementById('successToast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function checkPassword() {
            if(document.getElementById('passwordField').value === "naz@tn") {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('screen1').style.display = 'block';
                document.body.className = 'bg-screen1';
            } else {
                showPopup(); // Yahan popup call hoga
            }
        }

        function sendEmail() {
            // Mocking the EmailJS success
            showSuccess(); // Yahan toast call hoga
        }
    </script>
</body>
</html>
