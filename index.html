<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Message</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){ emailjs.init({ publicKey: "5ijt6R7KPYcuCtNvK" }); })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #0f0c20; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .card { 
            background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 20px; 
            width: 90%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            display: none; 
            animation: fadeIn 0.5s ease;
        }
        
        #lockScreen { display: block; }

        input, textarea { width: 100%; padding: 15px; margin: 15px 0; border-radius: 10px; border: 1px solid #444; background: rgba(0,0,0,0.3); color: #fff; }
        button { padding: 12px 30px; border-radius: 25px; border: none; background: linear-gradient(45deg, #00ffcc, #0099ff); font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        #toast { 
            position: fixed; bottom: 30px; background: #222; border: 1px solid #00ffcc; 
            color: #00ffcc; padding: 15px 25px; border-radius: 30px; 
            display: none; z-index: 9999; box-shadow: 0 0 15px rgba(0,255,204,0.3);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="toast"></div>

    <!-- Lock Screen -->
    <div id="lockScreen" class="card">
        <h1>🔒 Locked</h1>
        <input type="password" id="passInput" placeholder="Enter Password">
        <button onclick="checkPass()">Unlock</button>
    </div>

    <!-- Screen 1 -->
    <div id="screen1" class="card">
        <h1>Naya Pyar Mubarak! ❤️</h1>
        <button onclick="nextScreen('screen2')">Next</button>
    </div>

    <!-- Screen 2 -->
    <div id="screen2" class="card">
        <h1>Naya Yaar Mubarak! ✨</h1>
        <button onclick="nextScreen('screen3')">Next</button>
    </div>

    <!-- Screen 3 -->
    <div id="screen3" class="card">
        <p>"Chehra Badla, Rasta Badla, Baad Mein Yaar Badla..." 💔</p>
        <button onclick="nextScreen('screen4')">Next</button>
    </div>

    <!-- Screen 4 -->
    <div id="screen4" class="card">
        <textarea id="msgBox" rows="4" placeholder="Kuch likhein..."></textarea>
        <button onclick="sendMsg()">Send Message</button>
    </div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        function checkPass() {
            const p = document.getElementById('passInput').value;
            if (p === "1234") {
                nextScreen('screen1');
            } else {
                showToast("❌ Wrong Password!");
            }
        }

        function nextScreen(id) {
            // Saari screens hide karo
            document.querySelectorAll('.card').forEach(s => s.style.display = 'none');
            // Target show karo
            document.getElementById(id).style.display = 'block';
        }

        function sendMsg() {
            const msg = document.getElementById('msgBox').value;
            if(!msg) return showToast("Pehle kuch likho toh sahi!");
            
            emailjs.send('service_g9hb3t6', 'template_e9aw4ub', {message: msg})
                .then(() => {
                    showToast("✔️ Message Bhej Diya!");
                    document.getElementById('msgBox').value = "";
                })
                .catch(() => showToast("❌ Error aaya!"));
        }
    </script>
</body>
</html>
